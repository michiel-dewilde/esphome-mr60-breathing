; On-device benchmark for the breathing DSP.
;
; The question this answers: the ESP32-C6 is RV32IMAC and has no hardware
; floating point, so every float operation is a libgcc call. How long does one
; analysis pass actually take? The answer decides whether the DSP can run
; inline or needs its own task, and whether the default window has to shrink.
;
; This uses the Arduino framework rather than ESP-IDF, deliberately: it is the
; toolchain already proven on this board, and what is being measured is the
; cost of float arithmetic on this core, which does not depend on the
; framework. The shipped component targets ESP-IDF.
;
; The official espressif32 platform stopped before the ESP32-C6; the pioarduino
; fork provides Arduino core 3.x with C6 support.

[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -O2
    -I../../components/mr60_breathing

build_src_filter = +<*> +<../../../components/mr60_breathing/dsp.c>

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
